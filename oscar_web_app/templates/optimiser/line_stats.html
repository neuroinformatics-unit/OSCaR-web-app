{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Line statistics{% endblock title %}
{% block content %}
  <div class="d-flex flex-column">
    {% crispy form %}
    <div class="my-3 border-bottom border-secondary"></div>
    <div class="position-relative panel-with-spinner">
      <div id="line-stats-container"></div>
      <div id="line-stats-spinner"
           class="htmx-indicator position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75 pe-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
