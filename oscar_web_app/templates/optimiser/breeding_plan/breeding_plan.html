{% extends "base.html" %}

{% load crispy_forms_tags %}

{% block title %}Select line{% endblock title %}
{% block content %}
  <div class="container-fluid my-4">
    <div class="row">
      <div class="col-md-4 border-end border-secondary">{% crispy form %}</div>
      <div class="col position-relative panel-with-spinner">
        <div id="genotype-form-container" class="mx-2"></div>
        <div id="genotypes-spinner"
             class="htmx-indicator position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75 pe-none">
          <div class="spinner-border text-primary" role="status">
            <span class="visually-hidden">Loading...</span>
          </div>
        </div>
      </div>
    </div>
    <div class="row my-3 mx-3 border-bottom border-secondary"></div>
    <div class="row position-relative panel-with-spinner">
      <div id="results-container"></div>
      <div id="results-spinner"
           class="htmx-indicator position-absolute top-0 start-0 w-100 h-100 d-flex align-items-center justify-content-center bg-white bg-opacity-75 pe-none">
        <div class="spinner-border text-primary" role="status">
          <span class="visually-hidden">Loading...</span>
        </div>
      </div>
    </div>
  </div>
{% endblock content %}
