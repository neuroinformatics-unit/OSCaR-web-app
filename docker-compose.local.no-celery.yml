volumes:
  oscar_web_app_local_postgres_data: {}
  oscar_web_app_local_postgres_data_backups: {}

services:
  django: &django
    build:
      context: .
      dockerfile: ./compose/local/django/Dockerfile
    image: oscar_web_app_local_django
    container_name: oscar_web_app_local_django
    depends_on:
      - postgres
    volumes:
      - /app/.venv
      - .:/app:z
    env_file:
      - ./.envs/.local/.django
      - ./.envs/.local/.postgres
      - ./.envs/.local/.colony
    ports:
      - '8000:8000'
    command: /start

  postgres:
    build:
      context: .
      dockerfile: ./compose/production/postgres/Dockerfile
    image: oscar_web_app_production_postgres
    container_name: oscar_web_app_local_postgres
    volumes:
      - oscar_web_app_local_postgres_data:/var/lib/postgresql/18/docker
      - oscar_web_app_local_postgres_data_backups:/backups
    env_file:
      - ./.envs/.local/.postgres
